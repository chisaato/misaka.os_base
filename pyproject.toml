[project]
name = "misaka-ansible-collections"
version = "0.1.0"
description = "Ansible Collections Monorepo Tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ansible>=9.0.0",
    "ansible-lint>=24.0.0",
    "yq>=3.4.3",
]

[dependency-groups]
dev = [
    "molecule>=24.0.0",
    "molecule-plugins[podman]>=23.5.0",
    "pytest>=8.0.0",
    "pytest-ansible>=24.0.0",
]
