---
- name: 派生 Docker CE 国内镜像选择
  ansible.builtin.set_fact:
    docker_use_cn_mirror: "{{ (host_geo.country | default('cn')) == 'cn' }}"

- name: 始终渲染上游 Docker CE repo 定义
  become: true
  ansible.builtin.template:
    src: docker-ce.repo.j2
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"

- name: 创建国内 mirrorlist 目录
  become: true
  ansible.builtin.file:
    path: /etc/dnf/mirrorlist
    state: directory
    mode: "0755"
  when: docker_use_cn_mirror

- name: 渲染国内 Docker CE mirrorlist
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/dnf/mirrorlist/{{ item.path | regex_replace('[.]j2$', '') }}"
    mode: "0644"
  with_community.general.filetree: templates/mirrorlist/
  when: docker_use_cn_mirror and item.state == 'file'

- name: 创建 DNF5 override 目录
  become: true
  ansible.builtin.file:
    path: /etc/dnf/repos.override.d
    state: directory
    mode: "0755"
  when: docker_use_cn_mirror

- name: 国内通过 DNF5 override 切换 Docker CE 下载镜像
  become: true
  ansible.builtin.template:
    src: docker-ce-override.repo.j2
    dest: /etc/dnf/repos.override.d/40-misaka-docker-ce.repo
    mode: "0644"
  when: docker_use_cn_mirror

- name: 海外清理 Docker CE override
  become: true
  ansible.builtin.file:
    path: /etc/dnf/repos.override.d/40-misaka-docker-ce.repo
    state: absent
  when: not docker_use_cn_mirror

- name: 海外探测 mirrorlist 目录
  become: true
  ansible.builtin.stat:
    path: /etc/dnf/mirrorlist
  register: docker_ce_mirrorlist_dir
  when: not docker_use_cn_mirror

- name: 海外查找残留的 Docker CE mirrorlist
  become: true
  ansible.builtin.find:
    paths: /etc/dnf/mirrorlist
    patterns: "docker-ce-*.mirrorlist"
    file_type: file
  register: docker_ce_orphan_mirrorlists
  when: not docker_use_cn_mirror and docker_ce_mirrorlist_dir.stat.isdir | default(false)

- name: 海外清理残留的 Docker CE mirrorlist
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ docker_ce_orphan_mirrorlists.files | default([]) }}"
  when: not docker_use_cn_mirror
