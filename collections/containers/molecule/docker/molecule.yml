---
# Docker 场景：Debian 12/13，docker-ce 路径（podman 驱动 + 自建 systemd 镜像）
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: docker-debian12
    image: debian:bookworm
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    systemd: always
    # molecule podman 驱动默认用 bash sleep 循环覆盖镜像 CMD,
    # 显式指定让 systemd 真正作为 PID 1
    command: [/lib/systemd/systemd]
    security_opts:
      - label=disable
  - name: docker-debian13
    image: debian:trixie
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    systemd: always
    command: [/lib/systemd/systemd]
    security_opts:
      - label=disable
provisioner:
  name: ansible
  connection_options:
    ansible_become: true
  log: true
  inventory:
    host_vars:
      docker-debian12:
        # 使用原生布尔，覆盖模板的 bool | to_json 渲染契约。
        docker_enable_firewall: true
      docker-debian13:
        docker_enable_firewall: true
  env:
    # 防止绕过 justfile 直跑 molecule 时丢失姊妹 collection 解析路径
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../.dev
verifier:
  name: ansible
