---
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
  options:
    managed: true
  libvirt:
    libvirt_image_source: fedora-checksum
    libvirt_fedora_release: 43
    libvirt_image_index_url: https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/
    libvirt_image_name_pattern: ^Fedora-Cloud-Base-Generic-43-[0-9.]+[.]x86_64[.]qcow2$$
    libvirt_memory_mib: 3072
    libvirt_disk_gib: 20
platforms:
  - name: fedora43
provisioner:
  name: ansible
  log: true
  playbooks:
    create: ../../../../shared/molecule/libvirt/create.yml
    destroy: ../../../../shared/molecule/libvirt/destroy.yml
ansible:
  cfg:
    defaults:
      host_key_checking: false
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../.dev
scenario:
  test_sequence:
    - syntax
    - destroy
    - create
    - converge
    - verify
    - destroy
verifier:
  name: ansible
