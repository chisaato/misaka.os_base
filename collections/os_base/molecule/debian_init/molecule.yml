dependency:
  name: galaxy
driver:
  name: vagrant
  provider:
    name: libvirt
    type: libvirt
platforms:
  - name: debian-11
    box: debian/bullseye64
    memory: 2048
    cpus: 4
  - name: debian-12
    box: debian/bookworm64
    memory: 2048
    cpus: 4
    # interfaces:
    #   - auto_config: true
    #     network_name: private_network
    #     type: static
    #     ip: 192.168.10.10
    # Dictionary of `config` options.
    # config_options:
    #   ssh.keep_alive: yes
    #   ssh.remote_user: "'vagrant'"
provisioner:
  name: ansible
  connection_options:
    ansible_ssh_user: vagrant
    ansible_become: true
  log: true
  lint:
    name: ansible-lint
verifier:
  name: ansible
