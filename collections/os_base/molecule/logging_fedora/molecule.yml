---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: logging-fedora43
    image: registry.fedoraproject.org/fedora:43
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    systemd: always
    command: [/sbin/init]
    security_opts:
      - label=disable
  - name: logging-fedora44
    image: registry.fedoraproject.org/fedora:44
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    systemd: always
    command: [/sbin/init]
    security_opts:
      - label=disable
provisioner:
  name: ansible
  connection_options:
    ansible_become: true
  log: true
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../.dev
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
