---
# 只写一项测试标记，验证 SSH 与幂等。不在这里重启。
- name: 写入 VM 冒烟标记
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: 确保标记目录存在
      ansible.builtin.file:
        path: /etc/misaka-molecule
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: 写入测试标记
      ansible.builtin.copy:
        dest: /etc/misaka-molecule/vm-smoke
        owner: root
        group: root
        mode: "0644"
        content: |
          marker=vm_smoke
          platform=debian13
