---
debian_init_enable_unattend_apt: true
# 是否安装基础工具以外的东西
debian_init_install_extra_tools: true

# 基础软件包列表
debian_init_packages:
  - vim
  - wget
  - curl
  - git
  - screen
  - subversion
  - python3
  - python3-pip
  - sudo
  - gnupg2
  - gnupg
  - unzip
  # 小工具
  - lsof
  - htop
  - iftop
  - ncdu
  - aria2
  - zstd
  # 增强 Shell
  - zsh
  - byobu
  # zsh 需要
  - lsd
  - fzf
  # 时间同步
  - chrony
