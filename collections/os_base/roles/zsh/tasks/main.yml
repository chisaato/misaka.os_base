- name: 移除 .zi 目录
  when: zsh_force_remove_zi
  ansible.builtin.file:
    path: "{{ ansible_facts['env'].HOME }}/.zi"
    state: absent
  register: zsh_remove_zi

- name: 渲染 ZSH 配置文件
  ansible.builtin.template:
    mode: "0644"
    src: "{{ role_path }}/templates/zshrc.j2"
    dest: "{{ ansible_facts['env'].HOME }}/.zshrc"

- name: 渲染 zi 片段
  ansible.builtin.template:
    mode: "0644"
    src: "{{ role_path }}/templates/zi-snippet-full.zsh.j2"
    dest: "{{ ansible_facts['env'].HOME }}/.zi-snippet-full.zsh"

# - name: 渲染 zprofile 配置
#   async: 0
#   poll: 5
#   ansible.builtin.template:
#     mode: "0644"
#     src: "{{ role_path }}/templates/zprofile.j2"
#     dest: "{{ ansible_facts['env'].HOME }}/.zprofile"

- name: 拷贝 p10k 配置文件
  ansible.builtin.copy:
    mode: "0644"
    src: "{{ role_path }}/files/p10k.zsh"
    dest: "{{ ansible_facts['env'].HOME }}/.p10k.zsh"

# 创建 ~/.zi/completions 目录以维持部分脚本兼容性
- name: 创建 ~/.zi/completions 目录
  ansible.builtin.file:
    mode: "0755"
    path: "{{ ansible_facts['env'].HOME }}/.zi/completions"
    state: directory

