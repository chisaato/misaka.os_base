- name: 渲染 RPMFusion 镜像源文件
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/yum.repos.d/{{ item.path | regex_replace('[.]j2$', '') }}"
    mode: "0644"
  with_community.general.filetree: templates/repos/rpmfusion/
  when: item.state == 'file' and fedora_repo_use_cn_mirror and not fedora_repo_vendor_relocated and 'tainted' not in item.path

- name: 创建 mirrorlist 目录
  become: true
  when: fedora_repo_use_mirrorlist and fedora_repo_use_cn_mirror
  ansible.builtin.file:
    mode: "0755"
    path: "/etc/dnf/mirrorlist/"
    state: directory
    owner: "root"
    group: "root"

- name: 渲染 RPMFusion mirrorlist 文件
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/dnf/mirrorlist/{{ item.path | regex_replace('[.]j2$', '') }}"
    mode: "0644"
  with_community.general.filetree: templates/mirrorlist/rpmfusion/
  when:
    - item.state == 'file'
    - fedora_repo_use_mirrorlist
    - fedora_repo_use_cn_mirror
    - not fedora_repo_vendor_relocated or item.path is not search('tainted') or fedora_repo_rpmfusion_enable_tained

- name: 渲染 RPMFusion Tainted mirrorlist 文件
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/dnf/mirrorlist/{{ item.path | regex_replace('[.]j2$', '') }}"
    mode: "0644"
  with_community.general.filetree: templates/mirrorlist/rpmfusion-tained/
  when: fedora_repo_vendor_relocated and fedora_repo_rpmfusion_enable_tained and fedora_repo_use_cn_mirror and item.state == 'file'

# 准备 RPMFusion Tained 源
# 需要注意的是,他们的签名密钥与对应的 Free/NonFree 是一样的,所以此处只需要安装一下包即可
# 如果选择不启用 Tained 源,那么渲染出来的 repo 中全都是 enable=0
- name: 安装 RPMFusion Free Tained 源
  become: true
  when: fedora_repo_rpmfusion_enable_tained
  ansible.builtin.dnf:
    name:
      - rpmfusion-free-release-tainted
      - rpmfusion-nonfree-release-tainted
    state: present
  register: fedora_repo_rpmfusion_tainted_install
  retries: 3
  delay: 10
  until: fedora_repo_rpmfusion_tainted_install is succeeded

- name: 渲染 RPMFusion Tained 镜像源文件
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/yum.repos.d/{{ item.path | regex_replace('[.]j2$', '') }}"
    mode: "0644"
  with_community.general.filetree: templates/repos/rpmfusion/
  when: fedora_repo_rpmfusion_enable_tained and item.state == 'file' and 'tainted' in item.path
