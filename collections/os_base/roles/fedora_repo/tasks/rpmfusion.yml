- name: 获取软件包安装状态
  become: true
  block:
    - name: "获取软件包 fact"
      ansible.builtin.package_facts:
        manager: auto

- name: 告知 RPMFusion 源安装文件的下载地址
  when: fedora_repo_use_cn_mirror
  ansible.builtin.debug:
    msg:
      - "RPMFusion 源使用 {{ fedora_repo_rpmfusion_mirror }}"

# 首先挑选地址
- name: 设定 RPMFusion 源 RPM 下载地址
  ansible.builtin.set_fact:
    fedora_repo_rpmfusion_free_url: https://mirrors.rpmfusion.org/free/fedora
    fedora_repo_rpmfusion_nonfree_url: https://mirrors.rpmfusion.org/nonfree/fedora
  when: not fedora_repo_use_cn_mirror

- name: 设定 RPMFusion 源 RPM 下载地址 (国内)
  ansible.builtin.set_fact:
    fedora_repo_rpmfusion_free_url: https://{{ fedora_repo_rpmfusion_mirror }}/rpmfusion/free/fedora
    fedora_repo_rpmfusion_nonfree_url: https://{{ fedora_repo_rpmfusion_mirror }}/rpmfusion/nonfree/fedora
  when: fedora_repo_use_cn_mirror

- name: 打印最终下载地址
  ansible.builtin.debug:
    msg:
      - "Free 源来自 {{ fedora_repo_rpmfusion_free_url }}/rpmfusion-free-release-{{ fedora_repo_target_major_version }}.noarch.rpm"
      - "NonFree 源来自 {{ fedora_repo_rpmfusion_nonfree_url }}/rpmfusion-nonfree-release-{{ fedora_repo_target_major_version }}.noarch.rpm"

# 安装,直接在线安装
# disable_gpg_check: 国内网络下 rpmfusion 的 GPG key 拉取易失败,权衡后跳过签名校验;
# 密钥随后随 release 包落地,后续安装走正常校验
- name: 安装 RPMFusion Free 源
  become: true
  ansible.builtin.dnf:
    disable_gpg_check: true # 国内网络下 rpmfusion key 拉取易失败,权衡后关闭签名校验
    # name: /tmp/rpmfusion-free.rpm
    name: "{{ fedora_repo_rpmfusion_free_url }}/rpmfusion-free-release-{{ fedora_repo_target_major_version }}.noarch.rpm"
    state: present
  register: fedora_repo_rpmfusion_free_install
  retries: 3
  delay: 10
  until: fedora_repo_rpmfusion_free_install is succeeded
  when: "'rpmfusion-free-release' not in ansible_facts.packages"

- name: 安装 RPMFusion NonFree 源
  become: true
  ansible.builtin.dnf:
    disable_gpg_check: true # 同上,国内网络下 key 拉取易失败
    # name: /tmp/rpmfusion-nonfree.rpm
    name: "{{ fedora_repo_rpmfusion_nonfree_url }}/rpmfusion-nonfree-release-{{ fedora_repo_target_major_version }}.noarch.rpm"
    state: present
  register: fedora_repo_rpmfusion_nonfree_install
  retries: 3
  delay: 10
  until: fedora_repo_rpmfusion_nonfree_install is succeeded
  when: "'rpmfusion-nonfree-release' not in ansible_facts.packages"

