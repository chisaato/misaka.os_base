fedora_repo_rpmfusion_free_tainted_repos:
  - repo_id: rpmfusion-free-tainted
    repo_name: RPM Fusion for Fedora $releasever - Free tainted
    repo_baseurl: https://{{ fedora_repo_rpmfusion_mirror }}/rpmfusion/free/fedora/tainted/$releasever/$basearch/
    repo_enabled: 1
    repo_gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-$releasever
    repo_metalink: https://mirrors.rpmfusion.org/metalink?repo=free-fedora-tainted-$releasever&arch=$basearch
    mirrorlist: file:///etc/dnf/mirrorlist/rpmfusion-free-tainted.mirrorlist
  - repo_id: rpmfusion-free-tainted-debuginfo
    repo_name: RPM Fusion for Fedora $releasever - Free tainted - Debug
    repo_baseurl: https://{{ fedora_repo_rpmfusion_mirror }}/rpmfusion/free/fedora/tainted/$releasever/$basearch/debug/
    repo_enabled: 0
    repo_gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-$releasever
    repo_metalink: https://mirrors.rpmfusion.org/metalink?repo=free-fedora-tainted-debug-$releasever&arch=$basearch
    mirrorlist: file:///etc/dnf/mirrorlist/rpmfusion-free-tainted-debuginfo.mirrorlist
  - repo_id: rpmfusion-free-tainted-source
    repo_name: RPM Fusion for Fedora $releasever - Free tainted - Source
    repo_baseurl: https://{{ fedora_repo_rpmfusion_mirror }}/rpmfusion/free/fedora/tainted/$releasever/SRPMS/
    repo_enabled: 0
    repo_gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-$releasever
    repo_metalink: https://mirrors.rpmfusion.org/metalink?repo=free-fedora-tainted-source-$releasever&arch=$basearch
    mirrorlist: file:///etc/dnf/mirrorlist/rpmfusion-free-tainted-source.mirrorlist
