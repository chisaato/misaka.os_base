fedora_repo_rpmfusion_nonfree_updates_repos:
  - repo_id: rpmfusion-nonfree-updates
    repo_name: RPM Fusion for Fedora $releasever - Nonfree - Updates
    repo_baseurl: https://{{ fedora_repo_rpmfusion_mirror }}/rpmfusion/nonfree/fedora/updates/$releasever/$basearch/
    repo_metalink: https://mirrors.rpmfusion.org/metalink?repo=nonfree-fedora-updates-released-$releasever&arch=$basearch
    repo_enabled: 1
    repo_gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-nonfree-fedora-$releasever
    mirrorlist: file:///etc/dnf/mirrorlist/rpmfusion-nonfree-updates.mirrorlist
  - repo_id: rpmfusion-nonfree-updates-debuginfo
    repo_name: RPM Fusion for Fedora $releasever - Nonfree - Updates Debug
    repo_baseurl: https://{{ fedora_repo_rpmfusion_mirror }}/rpmfusion/nonfree/fedora/updates/$releasever/$basearch/debug/
    repo_metalink: https://mirrors.rpmfusion.org/metalink?repo=nonfree-fedora-updates-released-debug-$releasever&arch=$basearch
    repo_enabled: 0
    repo_gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-nonfree-fedora-$releasever
    mirrorlist: file:///etc/dnf/mirrorlist/rpmfusion-nonfree-updates-debuginfo.mirrorlist
  - repo_id: rpmfusion-nonfree-updates-source
    repo_name: RPM Fusion for Fedora $releasever - Nonfree - Updates Source
    repo_baseurl: https://{{ fedora_repo_rpmfusion_mirror }}/rpmfusion/nonfree/fedora/updates/$releasever/SRPMS/
    repo_metalink: https://mirrors.rpmfusion.org/metalink?repo=nonfree-fedora-updates-released-source-$releasever&arch=$basearch
    repo_enabled: 0
    repo_gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-nonfree-fedora-$releasever
    mirrorlist: file:///etc/dnf/mirrorlist/rpmfusion-nonfree-updates-source.mirrorlist
