---
# 判定是否使用国内镜像,模板与任务统一消费该派生变量
- name: 判定是否使用国内镜像
  ansible.builtin.set_fact:
    debian_repo_use_cn_mirror: "{{ (host_geo.country | default('cn')) == 'cn' }}"

- name: 跳过:Debian 专用角色
  ansible.builtin.debug:
    msg: "跳过:Debian 专用角色"
  when: ansible_facts['distribution'] != 'Debian'

# block 级 when 会传导给内部任务
- name: Debian 源配置主体
  become: true
  when: ansible_facts['distribution'] == 'Debian'
  block:
    - name: 设置 apt 默认选择 stable 软件包
      ansible.builtin.template:
        mode: "0644"
        src: apt/00-stable.j2
        dest: /etc/apt/preferences.d/00-stable

    - name: 设置 apt 默认不覆盖配置文件
      ansible.builtin.template:
        mode: "0644"
        src: apt/05nooverdide.j2
        dest: /etc/apt/apt.conf.d/05nooverdide

    - name: "设置 Debian {{ debian_repo_target_codename }} 国内镜像源 (Legacy: <= 12)"
      when:
        - debian_repo_use_cn_mirror
        - debian_repo_target_major_version is version('13', '<')
      ansible.builtin.template:
        mode: "0644"
        src: sources-debian-cn.list.j2
        dest: /etc/apt/sources.list

    - name: "设置 Debian {{ debian_repo_target_codename }} 官方镜像源 (Legacy: <= 12)"
      when:
        - not debian_repo_use_cn_mirror
        - debian_repo_target_major_version is version('13', '<')
      ansible.builtin.template:
        mode: "0644"
        src: sources-debian.list.j2
        dest: /etc/apt/sources.list

    - name: "设置 Debian {{ debian_repo_target_codename }} 国内镜像源 (DEB822: >= 13)"
      when:
        - debian_repo_use_cn_mirror
        - debian_repo_target_major_version is version('13', '>=')
      ansible.builtin.template:
        mode: "0644"
        src: sources-debian-cn.sources.j2
        dest: /etc/apt/sources.list.d/debian.sources

    - name: "设置 Debian {{ debian_repo_target_codename }} 官方镜像源 (DEB822: >= 13)"
      when:
        - not debian_repo_use_cn_mirror
        - debian_repo_target_major_version is version('13', '>=')
      ansible.builtin.template:
        mode: "0644"
        src: sources-debian.sources.j2
        dest: /etc/apt/sources.list.d/debian.sources

    - name: "清理旧的 sources.list (DEB822: >= 13)"
      when: debian_repo_target_major_version is version('13', '>=')
      ansible.builtin.copy:
        content: "# Debian 13+ use DEB822 format in /etc/apt/sources.list.d/debian.sources\n"
        dest: /etc/apt/sources.list
        mode: "0644"
