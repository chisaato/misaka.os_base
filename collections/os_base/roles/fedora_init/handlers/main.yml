- name: 重载 DNF 自动更新服务
  become: true
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    state: restarted
    enabled: true
  listen: "restart dnf-automatic"

- name: 重载 DNF5 自动更新服务
  become: true
  ansible.builtin.systemd_service:
    name: dnf5-automatic.timer
    state: restarted
    enabled: true
  listen: "restart dnf5-automatic"
