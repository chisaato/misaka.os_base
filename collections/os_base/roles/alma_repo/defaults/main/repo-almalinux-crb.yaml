alma_repo_crb_repos:
  - repo_id: crb
    repo_name: AlmaLinux $releasever - CRB
    repo_baseurl: https://repo.almalinux.org/almalinux/$releasever/CRB/$basearch/os/
    repo_enabled: 0
    repo_gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-9
    repo_mirrorlist: https://mirrors.almalinux.org/mirrorlist/$releasever/crb
  - repo_id: crb-debuginfo
    repo_name: AlmaLinux $releasever - CRB - Debug
    repo_baseurl: https://repo.almalinux.org/vault/$releasever/CRB/debug/$basearch/
    repo_enabled: 0
    repo_gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-9
    repo_mirrorlist: https://mirrors.almalinux.org/mirrorlist/$releasever/crb-debug
  - repo_id: crb-source
    repo_name: AlmaLinux $releasever - CRB - Source
    repo_baseurl: https://repo.almalinux.org/vault/$releasever/CRB/Source/
    repo_enabled: 0
    repo_gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-9
    repo_mirrorlist: https://mirrors.almalinux.org/mirrorlist/$releasever/crb-source
