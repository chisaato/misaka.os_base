---
- name: 创建 journald 覆盖目录
  become: true
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# 与 systemd 的 tmpfiles.d/systemd.conf 中持久日志目录约定一致。
- name: 创建持久日志目录
  become: true
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  notify: Logging 重启 journald

- name: 配置 journald
  become: true
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/01-persist-storage.conf
    owner: root
    group: root
    mode: "0644"
  notify: Logging 重启 journald
